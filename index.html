<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Best exam ke liye</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: #09090b;
            color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 30px 20px;
        }
        .pill {
            background: #27272a;
            color: #a1a1aa;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #09090b;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid #27272a;
        }
        .time-box span { display: block; font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
        .time-box small { font-size: 0.7rem; color: #71717a; text-transform: uppercase; }
        .btn {
            display: block;
            background: #fafafa;
            color: #09090b;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover { background: #e4e4e7; }
    </style>
</head>
<body>
    <div class="card">
        <span class="pill">STATUS: 17 SE KAND SHURU 💀</span>
        <h1>Bhoomishka, Insta Band Kar 📱</h1>
        <p>Parso se exams hain aur tu abhi bhi delulu me ghum rahi hai ki syllabus apne aap complete ho jayega. Reality check dekh le pehle:</p>

        <div class="timer-grid">
            <div class="time-box"><span id="d">00</span><small>Days</small></div>
            <div class="time-box"><span id="h">00</span><small>Hours</small></div>
            <div class="time-box"><span id="m">00</span><small>Mins</small></div>
            <div class="time-box"><span id="s">00</span><small>Secs</small></div>
        </div>

        <a href="page2.html" class="btn">Chalo Sharam Karo, Aage Badho →</a>
    </div>

    <script>
        const examDate = new Date(`September 17, ${new Date().getFullYear()} 09:00:00`).getTime();
        setInterval(() => {
            const diff = examDate - new Date().getTime();
            const pad = n => String(Math.max(0, n)).padStart(2, '0');
            document.getElementById('d').innerText = pad(Math.floor(diff / (1000 * 60 * 60 * 24)));
            document.getElementById('h').innerText = pad(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            document.getElementById('m').innerText = pad(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)));
            document.getElementById('s').innerText = pad(Math.floor((diff % (1000 * 60)) / 1000));
        }, 1000);
    </script>
</body>
</html>
